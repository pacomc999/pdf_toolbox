<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Toolbox</title>

  <!-- Web app setup: name, icon, and its own window when installed -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PDF Toolbox">
  <!-- Colour of the installed app's window bar; set to match the page below -->
  <meta name="theme-color" id="theme-color" content="#ffffff">

  <!-- Applies a saved Dark mode choice before the page is drawn, so it never flashes,
       and gives the window bar the matching colour -->
  <script>
    const BAR_COLOURS = { light: '#ffffff', dark: '#0b0c0d' }; // same as the page background

    // "dark" or "light": the switch's saved choice, else the computer's setting
    function currentTheme() {
      const chosen = document.documentElement.dataset.theme;
      if (chosen) return chosen;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function updateBarColour() {
      document.getElementById('theme-color').content = BAR_COLOURS[currentTheme()];
    }

    try {
      const savedTheme = localStorage.getItem('pdf_toolbox:theme');
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    } catch (error) { /* storage blocked: follow the computer */ }
    updateBarColour();
  </script>
  <style>
    /* ==========================================================
       The look shared with Walk Studio (after Linear): warm low
       saturation greys, one indigo accent, Inter at 400 / 510 / 590,
       faint outlines instead of borders and shadows, no boxes around
       the content, and buttons that never move (only colours change).
       ========================================================== */

    /* Inter, kept in the project so it also works offline */
    @font-face {
      font-family: "Inter";
      src: url("vendor/inter-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }

    /* ---- Colours: light theme ---- */
    :root {
      --frame: #ffffff;       /* the page */
      --panel: #ffffff;       /* file rows and fields */
      --raised: #f3f3f5;      /* hover shade */
      --raised-2: #e9e9ec;    /* pressed shade */
      --text-1: #282a30;      /* main text */
      --text-2: #4f4e57;      /* secondary text */
      --text-3: #6b6a73;      /* quiet text */
      --line-2: #b4b3ba;      /* dashed drop area */
      --hairline: rgba(0, 0, 0, 0.12);
      --hairline-strong: rgba(0, 0, 0, 0.2);
      --brand: #5e6ad2;       /* the one indigo */
      --brand-hover: #4f5bc4;
      --brand-tint: #f1f1ff;
      --error: #d93f3f;
      --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --font: "Inter", "SF Pro Display", -apple-system, "Segoe UI", system-ui, sans-serif;
    }

    /* ---- Colours: dark theme ----
       On when the Dark mode switch is on (data-theme="dark"), or when the
       computer is in dark mode and the switch was never used. */
    :root[data-theme="dark"] {
      --frame: #0b0c0d;
      --panel: #15161a;
      --raised: #1c1d21;
      --raised-2: #232428;
      --text-1: #f7f8f8;
      --text-2: #b4b9c1;
      --text-3: #8a8f98;
      --line-2: #4c4c54;
      --hairline: rgba(255, 255, 255, 0.12);
      --hairline-strong: rgba(255, 255, 255, 0.2);
      --brand-hover: #6b77e0;
      --brand-tint: #18182f;
      --error: #f06a6a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --frame: #0b0c0d;
        --panel: #15161a;
        --raised: #1c1d21;
        --raised-2: #232428;
        --text-1: #f7f8f8;
        --text-2: #b4b9c1;
        --text-3: #8a8f98;
        --line-2: #4c4c54;
        --hairline: rgba(255, 255, 255, 0.12);
        --hairline-strong: rgba(255, 255, 255, 0.2);
        --brand-hover: #6b77e0;
        --brand-tint: #18182f;
        --error: #f06a6a;
      }
    }

    /* ---- Reset and base ---- */
    /* "hidden" always wins, even over display: flex below */
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      font-size: 13px;
      background: var(--frame);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
    }

    /* Holds the whole tool in one column, straight on the page (no box) */
    .panel {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 24px;
      font-weight: 590;
      letter-spacing: -0.012em;
      margin-bottom: 4px;
    }
    .subtitle { color: var(--text-2); margin-bottom: 24px; }

    /* Title on the left, Dark mode switch on the right */
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }

    /* ---- Dark mode switch ----
       A checkbox drawn as a small switch. The knob jumps (no sliding),
       only the colours fade, like every other control here. */
    .theme-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-2);
      font-weight: 510;
      cursor: pointer;
      user-select: none;
    }
    .theme-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .theme-switch .moon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linejoin: round;
    }
    .theme-switch .track {
      position: relative;
      width: 30px;
      height: 18px;
      border-radius: 9px;
      background: var(--raised-2);
      box-shadow: 0 0 0 1px var(--hairline-strong);
      transition: background-color 0.1s var(--ease);
    }
    .theme-switch .track::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }
    .theme-switch input:checked + .track { background: var(--brand); box-shadow: none; }
    .theme-switch input:checked + .track::after { left: 14px; }
    .theme-switch input:focus-visible + .track { outline: 1px solid var(--brand); outline-offset: 2px; }

    /* Keyboard focus: a thin indigo outline */
    :focus-visible { outline: 1px solid var(--brand); outline-offset: 2px; }

    /* ---- Drop zone / pick area ---- */
    #drop-zone {
      border: 1px dashed var(--line-2);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.1s var(--ease), border-color 0.1s var(--ease);
    }
    #drop-zone:hover { background: var(--raised); }
    #drop-zone.drag-over {
      border-color: var(--brand);
      background: var(--brand-tint);
    }
    #drop-zone p { color: var(--text-1); }
    #pick-label { color: var(--brand); font-weight: 510; cursor: pointer; } /* only "browse" is indigo */
    #file-input { display: none; }

    /* ---- File list ---- */
    #file-list {
      list-style: none;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #file-list:empty { margin-top: 0; }

    .file-item {
      display: flex;
      align-items: center;
      height: 40px;
      background: var(--panel);
      border-radius: 8px;
      box-shadow: 0 0 0 1px var(--hairline);
      padding: 0 8px 0 12px;
      gap: 10px;
      cursor: grab;
      user-select: none;
      transition: background-color 0.1s var(--ease), box-shadow 0.1s var(--ease);
    }
    .file-item:hover {
      background: var(--raised);
      box-shadow: 0 0 0 1px var(--hairline-strong);
    }
    .file-item.dragging { opacity: 0.4; }
    .file-item.drag-target { box-shadow: 0 0 0 1px var(--brand); }

    .drag-handle {
      color: var(--text-3);
      font-size: 14px;
      cursor: grab;
      flex-shrink: 0;
    }

    .file-name {
      flex: 1;
      font-weight: 510;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-error {
      font-size: 12px;
      color: var(--error);
      flex-shrink: 0;
    }

    /* A quiet "ghost" button: no outline until hovered */
    .remove-btn {
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-3);
      font: inherit;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.1s var(--ease), color 0.1s var(--ease);
    }
    .remove-btn:hover { background: var(--raised-2); color: var(--error); }

    /* ---- Actions ---- */
    #actions {
      margin-top: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    #actions.visible { display: flex; }

    #filename-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #filename-row label,
    .option-label {
      width: 92px;  /* same width on both rows, so the controls line up */
      font-weight: 510;
      color: var(--text-2);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .option-row { display: flex; align-items: center; gap: 8px; }

    /* ---- Segmented choice (Original / Medium / Small) ----
       Radio buttons drawn as one bar; the chosen one is lifted out. */
    .segmented {
      display: flex;
      padding: 2px;
      border-radius: 8px;
      background: var(--raised-2);
    }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented span {
      display: block;
      padding: 5px 12px;
      border-radius: 6px;
      color: var(--text-2);
      font-weight: 510;
      cursor: pointer;
      transition: background-color 0.1s var(--ease), color 0.1s var(--ease);
    }
    .segmented span:hover { color: var(--text-1); }
    .segmented input:checked + span {
      background: var(--panel);
      color: var(--text-1);
      box-shadow: 0 0 0 1px var(--hairline-strong);
    }
    .segmented input:focus-visible + span { outline: 1px solid var(--brand); outline-offset: 1px; }
    .segmented input:disabled + span { opacity: 0.4; cursor: not-allowed; }

    /* The Merge / Compress switch under the subtitle */
    .tool-tabs { align-self: flex-start; margin-bottom: 16px; }
    .tool-tabs span { padding: 6px 16px; }
    #filename-input {
      flex: 1;
      min-width: 0;
      height: 32px;
      border: 0;
      border-radius: 6px;
      box-shadow: 0 0 0 1px var(--hairline-strong);
      background: var(--panel);
      color: var(--text-1);
      padding: 0 10px;
      font: inherit;
      outline: none;
      transition: box-shadow 0.1s var(--ease);
    }
    #filename-input:focus { box-shadow: 0 0 0 1px var(--brand); }
    #filename-ext { color: var(--text-3); flex-shrink: 0; }

    /* The one strong button: indigo, colour change only */
    #merge-btn {
      height: 40px;
      border: 0;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 510;
      cursor: pointer;
      transition: background-color 0.1s var(--ease);
    }
    #merge-btn:hover { background: var(--brand-hover); }
    #merge-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #merge-btn:disabled:hover { background: var(--brand); }

    #status {
      color: var(--text-2);
      text-align: center;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <!-- One column that holds the whole tool -->
  <main class="panel">

  <div class="title-row">
    <h1>PDF Toolbox</h1>
    <label class="theme-switch" title="Dark mode">
      <!-- Moon icon instead of the words; aria-label keeps the name for screen readers -->
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <input type="checkbox" id="theme-switch" role="switch" aria-label="Dark mode">
      <span class="track"></span>
    </label>
  </div>
  <p class="subtitle">Merge PDF files and make them smaller. Everything stays on your device.</p>

  <!-- Which tool is showing: a two part switch, same style as Image size -->
  <div class="segmented tool-tabs" role="radiogroup" aria-label="Tool">
    <label><input type="radio" name="tool" value="merge" checked><span>Merge</span></label>
    <label><input type="radio" name="tool" value="compress"><span>Compress</span></label>
  </div>

  <div id="drop-zone">
    <p><span id="drop-text">Drag and drop PDF files here</span>, or <span id="pick-label">browse</span></p>
    <input type="file" id="file-input" accept=".pdf,application/pdf" multiple>
  </div>

  <ul id="file-list"></ul>

  <div id="actions">
    <!-- Compress only: how much to shrink the pictures inside (scans, photos); text stays sharp -->
    <div id="size-row" class="option-row">
      <span class="option-label">Image size</span>
      <div class="segmented" role="radiogroup" aria-label="Image size">
        <label><input type="radio" name="level" value="medium" checked><span>Medium</span></label>
        <label><input type="radio" name="level" value="small"><span>Small</span></label>
      </div>
    </div>
    <div id="filename-row" class="option-row">
      <label for="filename-input">Output name</label>
      <input type="text" id="filename-input" placeholder="merged" spellcheck="false">
      <span id="filename-ext">.pdf</span>
    </div>
    <button id="merge-btn">Merge and Download</button>
    <p id="status"></p>
  </div>

  </main>

  <!-- pdf-lib 1.17.1 (MIT licence), kept in the project so merging works offline -->
  <script src="vendor/pdf-lib.min.js"></script>
  <!-- Shrinks the pictures inside a PDF -->
  <script src="compress.js"></script>
  <script>
    // ---- Offline support (web app) ----
    // Registers sw.js, which keeps a copy of the app on the device.
    // Only works on a real web address, not when opening the file directly.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // Not fatal: the app still works, just not offline
      });
    }

    // ---- Dark mode switch ----
    // Until it is used, the page follows the computer's light or dark setting.
    // Once flipped, the choice is remembered in this browser.
    const THEME_KEY = 'pdf_toolbox:theme';
    const themeSwitch = document.getElementById('theme-switch');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

    // Shows the switch on when the page is dark, whatever made it dark,
    // and gives the window bar the matching colour
    function updateThemeSwitch() {
      themeSwitch.checked = currentTheme() === 'dark';
      updateBarColour();
    }

    themeSwitch.addEventListener('change', () => {
      const theme = themeSwitch.checked ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      updateBarColour();
      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch (error) {
        // Storage blocked: the switch still works for this visit
      }
    });

    systemDark.addEventListener('change', updateThemeSwitch); // computer setting changed
    updateThemeSwitch();

    // ---- State ----
    // Each tool keeps its own list, so switching tabs never loses files.
    // A list holds { file: File, error: string|null } objects;
    // "files" is the list of the tool that is showing.
    const filesByTool = { merge: [], compress: [] };
    let tool = 'merge';
    let files = filesByTool.merge;

    // ---- Element refs ----
    const dropZone   = document.getElementById('drop-zone');
    const dropText   = document.getElementById('drop-text');
    const fileInput  = document.getElementById('file-input');
    const pickLabel  = document.getElementById('pick-label');
    const fileList   = document.getElementById('file-list');
    const actions    = document.getElementById('actions');
    const sizeRow    = document.getElementById('size-row');
    const mergeBtn     = document.getElementById('merge-btn');
    const statusEl     = document.getElementById('status');
    const filenameInput = document.getElementById('filename-input');

    // ---- File picking ----
    pickLabel.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('click', (e) => {
      if (e.target !== pickLabel) fileInput.click();
    });

    fileInput.addEventListener('change', () => {
      addFiles(Array.from(fileInput.files));
      fileInput.value = ''; // allow re-picking same file
    });

    // ---- Drag-over drop zone (file OS drag) ----
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const dropped = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf' || f.name.endsWith('.pdf'));
      addFiles(dropped);
    });

    // ---- Add files to state ----
    // Merge collects several files; Compress works on one, so a new file
    // replaces the old one. (Lists are changed in place, never replaced,
    // so filesByTool always holds the same lists.)
    function addFiles(newFiles) {
      if (newFiles.length === 0) return;
      if (tool === 'compress') {
        files.splice(0, files.length, { file: newFiles[0], error: null });
        render();
        return;
      }
      newFiles.forEach(f => {
        // Avoid exact duplicate filenames already in list
        const alreadyAdded = files.some(entry => entry.file.name === f.name && entry.file.size === f.size);
        if (!alreadyAdded) files.push({ file: f, error: null });
      });
      render();
    }

    // ---- Remove a file ----
    function removeFile(index) {
      files.splice(index, 1);
      render();
    }

    // ---- Render file list ----
    function render() {
      fileList.innerHTML = '';
      const canReorder = tool === 'merge';

      files.forEach((entry, index) => {
        const li = document.createElement('li');
        li.className = 'file-item';
        li.dataset.index = index;
        li.draggable = canReorder;

        // Build inner elements safely (no innerHTML interpolation of filenames)
        const nameSpan = document.createElement('span');
        nameSpan.className = 'file-name';
        nameSpan.textContent = entry.file.name;
        nameSpan.title = entry.file.name;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.setAttribute('aria-label', 'Remove');
        removeBtn.textContent = '×';

        // The drag handle only where the order matters (Merge)
        if (canReorder) {
          const handle = document.createElement('span');
          handle.className = 'drag-handle';
          handle.innerHTML = '&#9776;';
          li.appendChild(handle);
        } else {
          li.style.cursor = 'default';
        }
        li.appendChild(nameSpan);

        if (entry.error) {
          const errSpan = document.createElement('span');
          errSpan.className = 'file-error';
          errSpan.textContent = entry.error;
          li.appendChild(errSpan);
        }

        li.appendChild(removeBtn);

        // Read index from dataset at click time, not from closure
        removeBtn.addEventListener('click', (e) => {
          removeFile(parseInt(e.currentTarget.closest('.file-item').dataset.index));
        });

        if (canReorder) {
          li.addEventListener('dragstart', onDragStart);
          li.addEventListener('dragover',  onDragOver);
          li.addEventListener('dragleave', onDragLeave);
          li.addEventListener('drop',      onDrop);
          li.addEventListener('dragend',   onDragEnd);
        }

        fileList.appendChild(li);
      });

      // Merge needs two files, Compress one
      const needed = tool === 'merge' ? 2 : 1;
      actions.classList.toggle('visible', files.length >= needed);
      updateOptions();
      statusEl.textContent = '';
    }

    // ---- Tool tabs (Merge / Compress) ----
    const TOOL_KEY = 'pdf_toolbox:tool';
    const toolInputs = document.querySelectorAll('input[name="tool"]');

    // Shows one tool: its own file list, texts and options.
    // The choice is remembered, so the app opens on the last tool used.
    function switchTool(name) {
      tool = name;
      files = filesByTool[name];
      document.querySelector('input[name="tool"][value="' + name + '"]').checked = true;
      fileInput.multiple = name === 'merge';
      dropText.textContent = name === 'merge' ? 'Drag and drop PDF files here' : 'Drag and drop a PDF here';
      filenameInput.value = ''; // each tool suggests its own name
      render();
      try {
        localStorage.setItem(TOOL_KEY, name);
      } catch (error) {
        // Storage blocked: the tabs still work for this visit
      }
    }

    function savedTool() {
      try {
        return localStorage.getItem(TOOL_KEY) === 'compress' ? 'compress' : 'merge';
      } catch (error) {
        return 'merge';
      }
    }

    toolInputs.forEach(input => input.addEventListener('change', () => switchTool(input.value)));

    // ---- Options for the tool that is showing ----
    function chosenLevel() {
      return document.querySelector('input[name="level"]:checked').value;
    }

    // Image size only shows in Compress; the button and the suggested
    // file name follow the tool
    function updateOptions() {
      sizeRow.hidden = tool !== 'compress';
      mergeBtn.textContent = tool === 'merge' ? 'Merge and Download' : 'Compress and Download';
      filenameInput.placeholder = defaultName();
    }

    // "merged" when merging, "<name> compressed" when compressing
    function defaultName() {
      if (tool === 'merge' || files.length === 0) return 'merged';
      return files[0].file.name.replace(/\.pdf$/i, '') + ' compressed';
    }

    // ---- Drag-to-reorder handlers ----
    let dragSrcIndex = null;

    function onDragStart(e) {
      dragSrcIndex = parseInt(e.currentTarget.dataset.index);
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      // Required for Firefox
      e.dataTransfer.setData('text/plain', String(dragSrcIndex));
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.currentTarget.classList.add('drag-target');
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-target');
    }

    function onDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      const targetIndex = parseInt(e.currentTarget.dataset.index);
      if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;
      if (dragSrcIndex < 0 || dragSrcIndex >= files.length) return;

      // The dragged file takes the place of the row it was dropped on:
      // dragged down it lands just below that row, dragged up just above it.
      // (Taking it out first and putting it back at targetIndex does both.)
      const moved = files.splice(dragSrcIndex, 1)[0];
      files.splice(targetIndex, 0, moved);
      render();
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      // Clean up any leftover drag-target highlights
      document.querySelectorAll('.drag-target').forEach(el => el.classList.remove('drag-target'));
      dragSrcIndex = null;
    }

    // ---- The main button ----
    mergeBtn.addEventListener('click', () => (tool === 'merge' ? mergePDFs() : compressPDF()));

    // Greys out the button while working. render() clears the status line,
    // so it runs first and the message is set after it.
    function startWork(message) {
      files.forEach(entry => entry.error = null);
      render();
      mergeBtn.disabled = true;
      statusEl.textContent = message;
    }

    function finishWork(message) {
      render();
      statusEl.textContent = message;
      mergeBtn.disabled = false;
    }

    // ---- Merge and download ----
    async function mergePDFs() {
      startWork('Merging...');

      try {
        const { PDFDocument } = PDFLib;
        const merged = await PDFDocument.create();

        for (const entry of files) {
          // Read file as ArrayBuffer
          const arrayBuffer = await readFileAsArrayBuffer(entry.file);

          let srcDoc;
          try {
            srcDoc = await PDFDocument.load(arrayBuffer);
          } catch (err) {
            entry.error = 'Not a valid PDF';
            continue; // skip this file, keep going
          }

          const pageIndices = srcDoc.getPageIndices();
          const copiedPages = await merged.copyPages(srcDoc, pageIndices);
          copiedPages.forEach(page => merged.addPage(page));
        }

        // If every file had an error, bail out
        if (files.every(entry => entry.error !== null)) {
          finishWork('No valid PDFs to merge.');
          return;
        }
        const anyFailed = files.some(entry => entry.error !== null);

        const pdfBytes = await merged.save();
        downloadBlob(pdfBytes, outputName());

        finishWork(anyFailed
          ? 'Done. Some files were skipped (see errors above).'
          : 'Done! Your merged PDF has been downloaded.');

      } catch (err) {
        finishWork('Something went wrong. Please try again.');
      }
    }

    // ---- Compress and download ----
    // Works on the file itself (not a copy of its pages), so bookmarks,
    // links and form fields are kept.
    async function compressPDF() {
      const entry = files[0];
      startWork('Shrinking pictures...');

      try {
        let doc;
        try {
          doc = await PDFLib.PDFDocument.load(await readFileAsArrayBuffer(entry.file));
        } catch (err) {
          entry.error = 'Cannot read this PDF';
          finishWork('This PDF could not be read (it may be damaged or password protected).');
          return;
        }

        const shrunk = await compressImages(doc, chosenLevel());
        const pdfBytes = await doc.save();

        // Only download when the result is really smaller
        if (shrunk === 0 || pdfBytes.length >= entry.file.size) {
          finishWork('This PDF has no pictures that could be made smaller, so it was not changed.');
          return;
        }
        downloadBlob(pdfBytes, outputName());
        finishWork('Done! ' + formatSize(entry.file.size) + ' to ' + formatSize(pdfBytes.length) + '.');

      } catch (err) {
        finishWork('Something went wrong. Please try again.');
      }
    }

    // The name typed in the box, or the suggested one
    function outputName() {
      return (filenameInput.value.trim() || defaultName()) + '.pdf';
    }

    switchTool(savedTool());

    // ---- Helper: read File as ArrayBuffer ----
    function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsArrayBuffer(file);
      });
    }

    // ---- Helper: trigger file download ----
    function downloadBlob(bytes, filename) {
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 100);
    }
  </script>
