<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Merger</title>
  <style>
    /* Reset and base */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 32px;
    }

    /* Drop zone / pick area */
    #drop-zone {
      width: 100%;
      max-width: 520px;
      border: 2px dashed #aaa;
      border-radius: 10px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      background: #fff;
      transition: border-color 0.2s, background 0.2s;
    }
    #drop-zone.drag-over {
      border-color: #4f46e5;
      background: #eef2ff;
    }
    #drop-zone p { color: #666; font-size: 0.95rem; }
    #drop-zone span { color: #4f46e5; font-weight: 600; cursor: pointer; }
    #file-input { display: none; }

    /* File list */
    #file-list {
      width: 100%;
      max-width: 520px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-item {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 14px;
      gap: 12px;
      cursor: grab;
      user-select: none;
    }
    .file-item.dragging {
      opacity: 0.4;
    }
    .file-item.drag-target {
      border-color: #4f46e5;
      border-style: dashed;
    }

    .drag-handle {
      color: #aaa;
      font-size: 1.1rem;
      cursor: grab;
      flex-shrink: 0;
    }

    .file-name {
      flex: 1;
      font-size: 0.9rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-error {
      font-size: 0.8rem;
      color: #dc2626;
      flex-shrink: 0;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1rem;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
    }
    .remove-btn:hover { color: #dc2626; }

    /* Actions */
    #actions {
      width: 100%;
      max-width: 520px;
      margin-top: 20px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #actions.visible { display: flex; }

    #merge-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #merge-btn:hover { background: #4338ca; }
    #merge-btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    #status {
      font-size: 0.85rem;
      color: #666;
      text-align: center;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <h1>PDF Merger</h1>

  <div id="drop-zone">
    <p>Drag and drop PDF files here, or <span id="pick-label">browse</span></p>
    <input type="file" id="file-input" accept=".pdf,application/pdf" multiple>
  </div>

  <ul id="file-list"></ul>

  <div id="actions">
    <button id="merge-btn">Merge and Download</button>
    <p id="status"></p>
  </div>

  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
    // ---- State ----
    // files is an array of { file: File, error: string|null }
    let files = [];

    // ---- Element refs ----
    const dropZone   = document.getElementById('drop-zone');
    const fileInput  = document.getElementById('file-input');
    const pickLabel  = document.getElementById('pick-label');
    const fileList   = document.getElementById('file-list');
    const actions    = document.getElementById('actions');
    const mergeBtn   = document.getElementById('merge-btn');
    const statusEl   = document.getElementById('status');

    // ---- File picking ----
    pickLabel.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('click', (e) => {
      if (e.target !== pickLabel) fileInput.click();
    });

    fileInput.addEventListener('change', () => {
      addFiles(Array.from(fileInput.files));
      fileInput.value = ''; // allow re-picking same file
    });

    // ---- Drag-over drop zone (file OS drag) ----
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const dropped = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf' || f.name.endsWith('.pdf'));
      addFiles(dropped);
    });

    // ---- Add files to state ----
    function addFiles(newFiles) {
      newFiles.forEach(f => {
        // Avoid exact duplicate filenames already in list
        const alreadyAdded = files.some(entry => entry.file.name === f.name && entry.file.size === f.size);
        if (!alreadyAdded) files.push({ file: f, error: null });
      });
      render();
    }

    // ---- Remove a file ----
    function removeFile(index) {
      files.splice(index, 1);
      render();
    }

    // ---- Render file list ----
    function render() {
      fileList.innerHTML = '';

      files.forEach((entry, index) => {
        const li = document.createElement('li');
        li.className = 'file-item';
        li.dataset.index = index;
        li.draggable = true;

        // Build inner elements safely (no innerHTML interpolation of filenames)
        const handle = document.createElement('span');
        handle.className = 'drag-handle';
        handle.innerHTML = '&#9776;';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'file-name';
        nameSpan.textContent = entry.file.name;
        nameSpan.title = entry.file.name;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.setAttribute('aria-label', 'Remove');
        removeBtn.textContent = '\u00D7';

        li.appendChild(handle);
        li.appendChild(nameSpan);

        if (entry.error) {
          const errSpan = document.createElement('span');
          errSpan.className = 'file-error';
          errSpan.textContent = entry.error;
          li.appendChild(errSpan);
        }

        li.appendChild(removeBtn);

        // Read index from dataset at click time, not from closure
        removeBtn.addEventListener('click', (e) => {
          removeFile(parseInt(e.currentTarget.closest('.file-item').dataset.index));
        });

        li.addEventListener('dragstart', onDragStart);
        li.addEventListener('dragover',  onDragOver);
        li.addEventListener('dragleave', onDragLeave);
        li.addEventListener('drop',      onDrop);
        li.addEventListener('dragend',   onDragEnd);

        fileList.appendChild(li);
      });

      // Show/hide merge button area
      actions.classList.toggle('visible', files.length >= 2);
      statusEl.textContent = '';
    }

    // ---- Drag-to-reorder handlers ----
    let dragSrcIndex = null;

    function onDragStart(e) {
      dragSrcIndex = parseInt(e.currentTarget.dataset.index);
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      // Required for Firefox
      e.dataTransfer.setData('text/plain', String(dragSrcIndex));
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.currentTarget.classList.add('drag-target');
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-target');
    }

    function onDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      const targetIndex = parseInt(e.currentTarget.dataset.index);
      if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;
      if (dragSrcIndex < 0 || dragSrcIndex >= files.length) return;

      // When moving downward, removing the source item shifts subsequent indices by -1
      const moved = files.splice(dragSrcIndex, 1)[0];
      const adjustedTarget = dragSrcIndex < targetIndex ? targetIndex - 1 : targetIndex;
      files.splice(adjustedTarget, 0, moved);
      render();
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      // Clean up any leftover drag-target highlights
      document.querySelectorAll('.drag-target').forEach(el => el.classList.remove('drag-target'));
      dragSrcIndex = null;
    }

    // ---- Merge and download ----
    mergeBtn.addEventListener('click', mergePDFs);

    async function mergePDFs() {
      mergeBtn.disabled = true;

      // Clear previous errors and re-render (render() clears statusEl, so set status after)
      files.forEach(entry => entry.error = null);
      render();
      mergeBtn.disabled = true; // re-disable after render
      statusEl.textContent = 'Merging...';

      try {
        const { PDFDocument } = PDFLib;
        const merged = await PDFDocument.create();

        for (const entry of files) {
          // Read file as ArrayBuffer
          const arrayBuffer = await readFileAsArrayBuffer(entry.file);

          let srcDoc;
          try {
            srcDoc = await PDFDocument.load(arrayBuffer);
          } catch (err) {
            entry.error = 'Not a valid PDF';
            continue; // skip this file, keep going
          }

          const pageIndices = srcDoc.getPageIndices();
          const copiedPages = await merged.copyPages(srcDoc, pageIndices);
          copiedPages.forEach(page => merged.addPage(page));
        }

        // If every file had an error, bail out
        const allFailed = files.every(entry => entry.error !== null);
        if (allFailed) {
          render(); // render first so status isn't wiped
          statusEl.textContent = 'No valid PDFs to merge.';
          mergeBtn.disabled = false;
          return;
        }

        // Check if any had errors to warn user
        const anyFailed = files.some(entry => entry.error !== null);

        const pdfBytes = await merged.save();
        downloadBlob(pdfBytes, 'merged.pdf');

        render(); // render first so status isn't wiped
        statusEl.textContent = anyFailed
          ? 'Done. Some files were skipped (see errors above).'
          : 'Done! Your merged PDF has been downloaded.';

        mergeBtn.disabled = false;

      } catch (err) {
        statusEl.textContent = 'Something went wrong. Please try again.';
        mergeBtn.disabled = false;
      }
    }

    // ---- Helper: read File as ArrayBuffer ----
    function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsArrayBuffer(file);
      });
    }

    // ---- Helper: trigger file download ----
    function downloadBlob(bytes, filename) {
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 100);
    }
  </script>

</body>
</html>
